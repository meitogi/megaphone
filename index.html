<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Megaphone</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #12151a;
    --panel: #1b1f26;
    --line: #2c323c;
    --text: #e3e7ec;
    --muted: #8d96a3;
    --accent: #d97a66;
    --warn: #e8b04a;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0 auto 0 0; }
  #status { color: var(--muted); font-size: 13px; padding: 6px 16px; min-height: 1.5em; }
  #status.error { color: var(--accent); }
  main { display: grid; grid-template-columns: 260px minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 0 16px 16px; }
  @media (max-width: 980px) { main { grid-template-columns: minmax(0, 1fr); } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; min-width: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  h3 { font-size: 13px; margin: 12px 0 4px; color: var(--muted); }
  button { background: #262c35; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a0f0c; }
  label { display: block; font-size: 13px; color: var(--muted); margin-top: 8px; }
  input, select, textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; margin-top: 2px; }
  textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, monospace; font-size: 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; }
  .checks label { display: flex; align-items: center; gap: 4px; margin: 0; color: var(--text); }
  .checks input { width: auto; margin: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  #settings { margin: 12px 16px 0; }
  #settings[hidden] { display: none; }
  #settings .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 12px; }
  #settings p { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li button { width: 100%; text-align: left; margin: 2px 0; background: transparent; border-color: transparent; }
  li button.current { border-color: var(--accent); }
  li small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .card { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; }
  .card header { padding: 0; border: 0; gap: 8px; }
  .card header strong { margin-right: auto; text-transform: capitalize; }
  .count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .count.over { color: var(--accent); font-weight: 600; }
  .card pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; margin: 6px 0; }
  .card.skipped pre { opacity: .4; }
  .warn { color: var(--warn); font-size: 13px; margin: 2px 0; }
  .result { font-size: 13px; margin: 2px 0; overflow-wrap: anywhere; }
  .result a { color: var(--text); }
  .muted { color: var(--muted); font-size: 13px; }
  .copy { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 2px 0; }
  .copy span { overflow-wrap: anywhere; min-width: 0; }
  .copy button { padding: 2px 8px; font-size: 13px; }
  #manual { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>Megaphone</h1>
  <button id="new">New post</button>
  <button id="reload">Reload</button>
  <button id="toggle-settings" aria-expanded="false">Settings</button>
</header>

<section id="settings" hidden>
  <h2>Settings</h2>
  <div class="grid">
    <div>
      <label>Backend
        <select data-setting="backend">
          <option value="local">local (npm run ui)</option>
          <option value="github">github (contents API)</option>
        </select>
      </label>
      <label>GitHub owner <input data-setting="owner" placeholder="meitogi" autocomplete="off"></label>
      <label>GitHub repo <input data-setting="repo" placeholder="megaphone" autocomplete="off"></label>
      <label>Fine-grained PAT <input data-setting="token" type="password" autocomplete="off"></label>
    </div>
    <div>
      <label>Bluesky handle <input data-setting="bskyHandle" placeholder="meitogi.bsky.social" autocomplete="off"></label>
      <label>Bluesky app password <input data-setting="bskyPassword" type="password" autocomplete="off"></label>
      <label>Mastodon instance URL <input data-setting="mastoUrl" placeholder="https://fosstodon.org" autocomplete="off"></label>
      <label>Mastodon token <input data-setting="mastoToken" type="password" autocomplete="off"></label>
      <label>Discord webhook URL <input data-setting="discordWebhook" type="password" autocomplete="off"></label>
    </div>
  </div>
  <p>Stored in this browser's localStorage only. The repo is public : never paste a secret into a post.</p>
</section>

<div id="status" role="status"></div>

<main>
  <section>
    <h2>Posts</h2>
    <div id="list"><p class="muted">Loading…</p></div>
  </section>

  <section>
    <h2 id="editor-title">Editor</h2>
    <form id="editor" autocomplete="off">
      <div class="row">
        <label>Date <input name="date" placeholder="2026-11-03T09:00+01:00"></label>
        <label>Status
          <select name="status"><option>draft</option><option>ready</option><option>published</option></select>
        </label>
      </div>
      <label>Networks</label>
      <div class="checks" id="networks"></div>
      <div class="row">
        <label>Image <input name="image" placeholder="img/sandbox-dns.png"></label>
        <label>Alt text <input name="alt"></label>
      </div>
      <div class="row">
        <label>Tags <input name="tags" placeholder="ClaudeCode, devcontainer"></label>
        <label>Link <input name="link" type="url" placeholder="https://github.com/meitogi/…"></label>
      </div>
      <div class="row">
        <label>Title (Dev.to, Reddit, HN) <input name="title"></label>
        <label>Subreddit <input name="sub" placeholder="ClaudeAI"></label>
      </div>
      <label>Text <textarea name="body" rows="7"></textarea></label>
      <label>Long variant (LinkedIn, Facebook) <textarea name="long" rows="7"></textarea></label>
      <div class="actions">
        <button type="submit" class="primary" id="save">Save</button>
        <button type="button" id="ready">Mark ready</button>
        <button type="button" id="duplicate">Duplicate</button>
        <button type="button" id="delete">Delete</button>
      </div>
    </form>
  </section>

  <section>
    <h2>Preview</h2>
    <div id="preview"></div>
    <h3>Manual</h3>
    <div id="manual"></div>
  </section>
</main>

<script type="module">
import { parse, serialize, render, slug, expandNetworks, posted, record, intent, NETWORKS, STATUSES } from './lib/post.mjs';
import { local, github } from './lib/backends.mjs';
import { ACTION, SETTINGS, missing, publish, loadImage } from './lib/publish.mjs';

const KEY = 'megaphone.settings';
const FIELDS = ['date', 'networks', 'image', 'alt', 'tags', 'link', 'title', 'sub', 'status'];
const $ = (sel) => document.querySelector(sel);
const form = $('#editor');

// --- settings, all in localStorage -----------------------------------------

// On <owner>.github.io/<repo>/ with nothing saved yet, the github backend of that repo.
function defaults() {
  const host = location.hostname;
  if (!host.endsWith('.github.io')) return { backend: 'local' };
  const owner = host.slice(0, -'.github.io'.length);
  return { backend: 'github', owner, repo: location.pathname.split('/')[1] || host };
}
function loadSettings() {
  try {
    const raw = localStorage.getItem(KEY);
    return raw ? { backend: 'local', ...JSON.parse(raw) } : defaults();
  } catch { return defaults(); }
}
function saveSettings() {
  try { localStorage.setItem(KEY, JSON.stringify(settings)); }
  catch (e) { say(`Settings not saved : ${e.message}`, true); }
}
const settings = loadSettings();

for (const input of document.querySelectorAll('[data-setting]')) {
  const k = input.dataset.setting;
  input.value = settings[k] || input.value;
  input.addEventListener('change', () => {
    settings[k] = input.value.trim();
    saveSettings();
    if (k === 'backend' || k === 'owner' || k === 'repo' || k === 'token') reload();
    else if (current) renderPreview();
  });
}
$('#toggle-settings').addEventListener('click', (e) => {
  const box = $('#settings');
  box.hidden = !box.hidden;
  e.currentTarget.setAttribute('aria-expanded', String(!box.hidden));
});

function backend() {
  if (settings.backend !== 'github') return local();
  const { owner, repo, token } = settings;
  if (!owner || !repo || !token) throw new Error('GitHub backend : set owner, repo and PAT in Settings');
  return github({ owner, repo, token });
}

function say(msg, error = false) {
  const el = $('#status');
  el.textContent = msg;
  el.className = error ? 'error' : '';
}

// --- list -------------------------------------------------------------------

let posts = []; // [{ name, sha, post }]
let current = null; // { name, sha, post } ; name null until first save
let saved = null; // serialize(current.post) as last read or written, to tell unsaved edits

async function reload() {
  say('Loading…');
  try {
    const b = backend();
    const items = await b.list();
    posts = await Promise.all(items.map(async ({ name }) => {
      const { text, sha } = await b.read(name);
      return { name, sha, post: parse(text) };
    }));
    renderList();
    say(`${posts.length} post${posts.length === 1 ? '' : 's'} from ${settings.backend}`);
  } catch (e) {
    posts = [];
    renderList();
    say(e.message, true);
  }
}

function renderList() {
  const box = $('#list');
  box.replaceChildren();
  const groups = {};
  for (const s of STATUSES) groups[s] = [];
  for (const p of posts) (groups[p.post.meta.status] ||= []).push(p);
  for (const status in groups) {
    const group = groups[status].sort((a, b) => String(a.post.meta.date || '').localeCompare(String(b.post.meta.date || '')));
    const h = document.createElement('h3');
    h.textContent = `${status} (${group.length})`;
    const ul = document.createElement('ul');
    for (const p of group) {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.textContent = p.post.meta.title || p.post.body.split('\n')[0].slice(0, 60) || p.name;
      if (current && current.name === p.name) btn.className = 'current';
      const small = document.createElement('small');
      const nets = p.post.meta.networks;
      small.textContent = `${p.post.meta.date || 'no date'} · ${Array.isArray(nets) ? nets.join(', ') : nets || 'all'}`;
      btn.append(small);
      btn.addEventListener('click', () => open({ ...p, post: structuredClone(p.post) }));
      li.append(btn);
      ul.append(li);
    }
    box.append(h, ul);
  }
}

// --- editor -----------------------------------------------------------------

const netBox = $('#networks');
for (const n of ['all', ...NETWORKS]) {
  const label = document.createElement('label');
  const box = document.createElement('input');
  box.type = 'checkbox';
  box.value = n;
  label.append(box, n);
  netBox.append(label);
}

// Every field present (undefined is not serialized) so the file keeps FIELDS order.
function blank() {
  const meta = {};
  for (const f of FIELDS) meta[f] = undefined;
  meta.networks = 'all';
  meta.status = 'draft';
  return { meta, body: '', long: null };
}

function open(entry) {
  current = entry;
  saved = entry.name ? serialize(entry.post) : null;
  const { meta, body, long } = entry.post;
  for (const f of FIELDS) {
    if (f === 'networks') continue;
    const v = meta[f];
    form.elements[f].value = Array.isArray(v) ? v.join(', ') : v || (f === 'status' ? 'draft' : '');
  }
  const nets = meta.networks == null || meta.networks === 'all' ? ['all'] : [].concat(meta.networks);
  for (const box of netBox.querySelectorAll('input')) box.checked = nets.includes(box.value);
  form.elements.body.value = body;
  form.elements.long.value = long || '';
  $('#editor-title').textContent = entry.name ? `Editor — ${entry.name}` : 'Editor — unsaved';
  renderList();
  renderPreview();
}

// Form → current.post.meta : an empty field is unset in place, so keys keep their order.
function readForm() {
  const { meta } = current.post;
  for (const f of FIELDS) {
    if (f === 'networks') continue;
    const v = form.elements[f].value.trim();
    if (!v) meta[f] = undefined;
    else meta[f] = f === 'tags' ? v.split(',').map((t) => t.trim()).filter(Boolean) : v;
  }
  const checked = [...netBox.querySelectorAll('input:checked')].map((b) => b.value);
  meta.networks = checked.includes('all') ? 'all' : checked;
  current.post.body = form.elements.body.value;
  current.post.long = form.elements.long.value.trim() ? form.elements.long.value : null;
}

form.addEventListener('input', () => { readForm(); renderPreview(); });

function freeName(post) {
  const { meta, body } = post;
  const day = meta.date || new Date().toISOString().slice(0, 10);
  const base = slug(day, meta.title || body.split(/\s+/).slice(0, 6).join(' '));
  const taken = {};
  for (const p of posts) taken[p.name] = true;
  let name = base;
  for (let i = 2; taken[name]; i++) name = base.replace(/\.md$/, `-${i}.md`);
  return name;
}

async function save() {
  readForm();
  try {
    const name = current.name || freeName(current.post);
    const { sha } = await backend().write(name, serialize(current.post), current.sha);
    current.name = name;
    current.sha = sha;
    await reload();
    open({ ...current });
    say(`Saved posts/${name}`);
  } catch (e) {
    say(e.message, true);
  }
}

form.addEventListener('submit', (e) => { e.preventDefault(); save(); });

$('#ready').addEventListener('click', () => {
  readForm();
  if (!current.post.meta.date) return say('Mark ready needs a date', true);
  form.elements.status.value = 'ready';
  save();
});

$('#duplicate').addEventListener('click', () => {
  readForm();
  const post = structuredClone(current.post);
  post.meta.status = 'draft';
  open({ name: null, sha: null, post });
  say('Copy opened, not saved yet');
});

$('#delete').addEventListener('click', async () => {
  if (!current.name) return open({ name: null, sha: null, post: blank() });
  if (!confirm(`Delete posts/${current.name} ?`)) return;
  try {
    const name = current.name;
    await backend().remove(name, current.sha);
    open({ name: null, sha: null, post: blank() });
    await reload();
    say(`Deleted posts/${name}`);
  } catch (e) {
    say(e.message, true);
  }
});

$('#new').addEventListener('click', () => open({ name: null, sha: null, post: blank() }));
$('#reload').addEventListener('click', reload);

// --- preview ----------------------------------------------------------------

function renderPreview() {
  const box = $('#preview');
  box.replaceChildren();
  const nets = expandNetworks(current.post.meta.networks);
  if (!nets.length) box.textContent = 'No network selected.';
  for (const n of nets) {
    const r = render(current.post, n);
    const card = document.createElement('article');
    card.className = r.skipped ? 'card skipped' : 'card';
    const head = document.createElement('header');
    const name = document.createElement('strong');
    name.textContent = n;
    const count = document.createElement('span');
    count.className = r.limit && r.count > r.limit ? 'count over' : 'count';
    count.textContent = r.limit ? `${r.count} / ${r.limit}` : `${r.count}`;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Publish';
    const why = blocker(n, r);
    btn.disabled = Boolean(why);
    btn.title = why || (n === 'devto' ? 'Run publish.yml for devto on this post' : `Publish to ${n} now`);
    btn.addEventListener('click', () => (n === 'devto' ? dispatchNow(btn) : publishNow(n, btn)));
    head.append(name, count, btn);
    let it = null;
    if (COMPOSE.includes(n)) {
      it = intent(current.post, n);
      head.append(composeButton(n, it, 'Compose'));
    }
    const pre = document.createElement('pre');
    pre.textContent = r.text;
    card.append(head, pre);
    if (it && it.copy) card.append(copyRow(n === 'x' ? 'Reply with the link :' : 'Text to paste :', it.copy));
    const result = current.post.meta[n];
    if (ACTION.includes(n) && result) {
      const p = document.createElement('p');
      p.className = posted(current.post, n) ? 'result' : 'result warn';
      if (/^https?:\/\//.test(result)) {
        const a = document.createElement('a');
        a.href = result;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = result;
        p.append('Published : ', a);
      } else p.textContent = result;
      card.append(p);
    }
    for (const w of r.warnings) {
      const p = document.createElement('p');
      p.className = 'warn';
      p.textContent = w;
      card.append(p);
    }
    box.append(card);
  }
  const manual = $('#manual');
  manual.replaceChildren();
  for (const [target, label] of MANUAL) manual.append(composeButton(target, intent(current.post, target), label));
}

function copyRow(label, text) {
  const p = document.createElement('p');
  p.className = 'copy';
  const span = document.createElement('span');
  span.textContent = `${label} ${text}`;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'Copy';
  btn.addEventListener('click', () => navigator.clipboard.writeText(text).then(
    () => say('Copied'),
    (e) => say(`Not copied : ${e.message}`, true),
  ));
  p.append(span, btn);
  return p;
}

// --- publish now (Bluesky, Mastodon, Discord) -------------------------------

const LATER = { threads: 4, linkedin: 4, facebook: 4, instagram: 4 };

// Why `network` cannot be published right now, or null.
function blocker(network, r) {
  if (network === 'x') return 'No API : use Compose';
  if (!ACTION.includes(network)) return `session ${LATER[network]}`;
  if (!current.name) return 'Save the post first';
  if (serialize(current.post) !== saved) return 'Unsaved changes : save first';
  if (network === 'devto') {
    if (settings.backend !== 'github') return 'Needs the github backend : the Action publishes from main';
    if (!current.post.meta.title) return 'Needs a title';
    return null;
  }
  const lacks = missing(network, settings);
  if (lacks.length) return `Set in Settings : ${lacks.join(', ')}`;
  if (r.skipped || !r.text.trim()) return 'Nothing to publish';
  if (r.limit && r.count > r.limit) return `Over the limit : ${r.count} / ${r.limit}`;
  return null;
}

async function publishNow(network, btn) {
  const { post } = current;
  const done = posted(post, network);
  if (done && !confirm(`Already published to ${network} :\n${done}\n\nPost it again ?`)) return;
  const { warnings } = render(post, network);
  if (warnings.length && !confirm(`${warnings.join('\n')}\n\nPublish to ${network} anyway ?`)) return;
  btn.disabled = true;
  say(`Publishing to ${network}…`);
  const secrets = [];
  for (const k in SETTINGS[network]) secrets.push(settings[k]);
  try {
    const b = backend();
    try {
      const image = await loadImage(post, (p) => b.bytes(p));
      record(post, network, await publish(post, network, { creds: settings, image, name: current.name }));
    } catch (e) {
      record(post, network, { error: e.message }, secrets);
    }
    const { sha } = await b.write(current.name, serialize(post), current.sha);
    current.sha = sha;
    saved = serialize(post);
    const ok = posted(post, network);
    await reload();
    open({ ...current });
    say(ok ? `Published to ${network} : ${ok}` : `${network} : ${post.meta[network]}`, !ok);
  } catch (e) {
    say(e.message, true);
    renderPreview();
  }
}

// --- Dev.to, through the Action -----------------------------------------------

async function dispatchNow(btn) {
  const done = posted(current.post, 'devto');
  if (done && !confirm(`Already published to devto :\n${done}\n\nThe Action skips it unless the key is removed. Dispatch anyway ?`)) return;
  btn.disabled = true;
  say('Dispatching publish.yml for devto…');
  try {
    await backend().dispatch({ post: current.name, network: 'devto' });
    say('Dispatched publish.yml for devto : reload in a minute');
  } catch (e) {
    say(e.message, true);
  }
  btn.disabled = false;
}

// --- pre-filled composers ---------------------------------------------------------

const COMPOSE = ['x', 'threads', 'linkedin', 'facebook'];
const MANUAL = [['reddit', 'Reddit'], ['hn', 'Hacker News']];
const COMPOSER_WIDTH = 640;

function composeButton(target, it, label) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = label;
  btn.dataset.target = target;
  btn.disabled = Boolean(it.blocked);
  btn.title = it.blocked || `Open the ${target} composer, prefilled`;
  btn.addEventListener('click', () => compose(target));
  return btn;
}

// The post image as a PNG Blob : the only image type every clipboard accepts.
async function pngBlob(path) {
  const ext = path.slice(path.lastIndexOf('.') + 1).toLowerCase();
  if (ext === 'mp4') throw new Error('a video is not copied');
  const bytes = await backend().bytes(path);
  if (ext === 'png') return new Blob([bytes], { type: 'image/png' });
  const bitmap = await createImageBitmap(new Blob([bytes]));
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width;
  canvas.height = bitmap.height;
  canvas.getContext('2d').drawImage(bitmap, 0, 0);
  return new Promise((resolve, reject) => canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('PNG conversion failed'))), 'image/png'));
}

// One click : the image goes to the clipboard, then the composer opens in a popup
// docked right. Both happen synchronously in the click handler, so the browser
// still counts the user's gesture ; the clipboard takes a Promise of the Blob,
// which keeps Safari's activation while the image loads.
function compose(target) {
  const it = intent(current.post, target);
  if (it.blocked) return say(it.blocked, true);
  const image = target === 'hn' ? null : current.post.meta.image;
  let copying = null;
  try {
    if (image) copying = navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob(image) })]).then(() => 'image');
    else if (it.copy) copying = navigator.clipboard.writeText(it.copy).then(() => 'text');
  } catch (e) {
    copying = Promise.reject(e);
  }
  const w = Math.min(COMPOSER_WIDTH, screen.availWidth);
  window.open(it.url, 'composer', `popup,width=${w},height=${screen.availHeight},left=${screen.availWidth - w},top=0`);
  if (!copying) return say(`${target} composer opened`);
  copying.then(
    (what) => say(what === 'image' ? `${target} composer opened, the image is on the clipboard : paste it` : `${target} composer opened, the text is on the clipboard`),
    (e) => say(`${target} composer opened, but the ${image ? 'image' : 'text'} was not copied : ${e.message}`, true),
  );
}

open({ name: null, sha: null, post: blank() });
reload();
</script>
